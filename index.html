<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>リザルト保管庫</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 12h16M4 7h16M4 17h10"/></svg>
        </div>
        <div>
          <h1>リザルト保管庫</h1>
          <p>プロジェクトセカイのリザルト画像を整理・検索・保存</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="connectDriveBtn" class="btn btn-ghost" type="button">Drive連携</button>
        <button id="openSettingsBtn" class="btn btn-ghost" type="button">設定</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="panel upload-panel">
          <div class="panel-title-row">
            <h2>アップロード</h2>
            <span id="driveStatusBadge" class="badge">未接続</span>
          </div>
          <label class="dropzone" id="dropzone">
            <input id="fileInput" type="file" accept="image/*" multiple hidden>
            <div class="dropzone-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            </div>
            <div>
              <strong>画像を選択</strong>
              <p>ドラッグ＆ドロップにも対応</p>
            </div>
          </label>
          <div class="field-row">
            <label>
              <span>登録方法</span>
              <select id="registerModeSelect">
                <option value="auto">自動登録</option>
                <option value="manual">手動登録</option>
              </select>
            </label>
            <label>
              <span>Driveへ保存</span>
              <select id="driveUploadSelect">
                <option value="ask">毎回確認</option>
                <option value="on">保存する</option>
                <option value="off">保存しない</option>
              </select>
            </label>
          </div>
          <div class="helper-text">自動登録時はOCRで候補を読み取り、手動登録時は下書きとして開きます。</div>
        </section>

        <section class="panel filter-panel">
          <div class="panel-title-row">
            <h2>検索・絞り込み</h2>
            <button id="resetFiltersBtn" type="button" class="btn btn-light small">解除</button>
          </div>
          <label class="searchbox">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/></svg>
            <input id="queryInput" type="search" placeholder="曲名・読み方・IDを検索">
          </label>
          <label>
            <span>楽曲レベル</span>
            <input id="levelQueryInput" type="text" placeholder="例: 35 / 33-35">
          </label>
          <div class="chips" id="difficultyChips"></div>
          <div class="toggle-row">
            <button class="toggle active" data-filter-best="all" type="button">全て表示</button>
            <button class="toggle" data-filter-best="ap" type="button">AP自己ベスト</button>
            <button class="toggle" data-filter-best="fc" type="button">FC自己ベスト</button>
          </div>
          <div class="toggle-row">
            <button class="toggle active" data-judge-filter="all" type="button">全件</button>
            <button class="toggle" data-judge-filter="ap" type="button">AP済み</button>
            <button class="toggle" data-judge-filter="fc" type="button">FC済み</button>
          </div>
          <div class="range-grid">
            <label>
              <span>APミス数</span>
              <div class="range-row"><input id="apMissMin" type="number" min="0" placeholder="下限"><input id="apMissMax" type="number" min="0" placeholder="上限"></div>
            </label>
            <label>
              <span>FCミス数</span>
              <div class="range-row"><input id="fcMissMin" type="number" min="0" placeholder="下限"><input id="fcMissMax" type="number" min="0" placeholder="上限"></div>
            </label>
          </div>
          <label>
            <span>楽曲難易度</span>
            <select id="difficultySelect">
              <option value="all">全て</option>
              <option value="EASY">EASY</option>
              <option value="NORMAL">NORMAL</option>
              <option value="HARD">HARD</option>
              <option value="EXPERT">EXPERT</option>
              <option value="MASTER">MASTER</option>
              <option value="APPEND">APPEND</option>
            </select>
          </label>
        </section>

        <section class="panel sort-panel">
          <div class="panel-title-row">
            <h2>並び替え</h2>
          </div>
          <label>
            <span>基準</span>
            <select id="sortKeySelect">
              <option value="name">名前順</option>
              <option value="level">楽曲レベル順</option>
              <option value="miss">ミス数順</option>
              <option value="added">追加日順</option>
            </select>
          </label>
          <label>
            <span>ミス数基準</span>
            <select id="missBasisSelect">
              <option value="ap">AP基準</option>
              <option value="contest">AP基準(大会基準)</option>
              <option value="fc">FC基準</option>
            </select>
          </label>
          <label>
            <span>順序</span>
            <select id="sortDirSelect">
              <option value="desc">降順</option>
              <option value="asc">昇順</option>
            </select>
          </label>
          <label>
            <span>表示基準</span>
            <select id="viewBasisSelect">
              <option value="ap">AP基準</option>
              <option value="contest">AP基準(大会基準)</option>
              <option value="fc">FC基準</option>
            </select>
          </label>
        </section>
      </aside>

      <section class="content">
        <section class="toolbar panel">
          <div class="toolbar-left">
            <div class="metric"><span>件数</span><strong id="countLabel">0</strong></div>
            <div class="metric"><span>ゴミ箱</span><strong id="trashCountLabel">0</strong></div>
            <div class="metric"><span>自己ベスト通知</span><strong id="notifyLabel">OFF</strong></div>
          </div>
          <div class="toolbar-right">
            <button id="openCalibrateBtn" class="btn btn-light" type="button">機種登録</button>
            <button id="exportJsonBtn" class="btn btn-light" type="button">JSON書き出し</button>
          </div>
        </section>

        <section class="panel list-panel">
          <div class="panel-title-row sticky-title">
            <h2>一覧</h2>
            <div class="list-tabs">
              <button class="tab active" data-list-tab="library" type="button">保管庫</button>
              <button class="tab" data-list-tab="trash" type="button">ゴミ箱</button>
            </div>
          </div>
          <div id="listViewport" class="list-viewport" aria-label="リザルト一覧"></div>
          <div id="emptyState" class="empty-state hidden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
            <h3>まだ記録がありません</h3>
            <p>画像をアップロードすると、ここにカードが並びます。</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <dialog id="recordDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="recordForm">
      <div class="dialog-head">
        <h2>楽曲情報</h2>
        <button class="icon-btn" value="cancel" aria-label="閉じる" type="submit">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="dialog-body">
        <div class="preview-wrap">
          <img id="recordPreview" alt="リザルト画像プレビュー">
        </div>
        <div class="form-grid">
          <label><span>タイトル</span><input id="editTitle" type="text"></label>
          <label><span>読み方</span><input id="editPronunciation" type="text"></label>
          <div class="two-col">
            <label><span>楽曲ID</span><input id="editMusicId" type="text"></label>
            <label><span>レベル</span><input id="editLevel" type="number" min="0"></label>
          </div>
          <label><span>難易度</span>
            <select id="editDifficulty">
              <option>EASY</option><option>NORMAL</option><option>HARD</option><option>EXPERT</option><option>MASTER</option><option>APPEND</option>
            </select>
          </label>
          <div class="two-col">
            <label><span>PERFECT</span><input id="editPerfect" type="number" min="0"></label>
            <label><span>GREAT</span><input id="editGreat" type="number" min="0"></label>
            <label><span>GOOD</span><input id="editGood" type="number" min="0"></label>
            <label><span>BAD</span><input id="editBad" type="number" min="0"></label>
            <label><span>MISS</span><input id="editMiss" type="number" min="0"></label>
            <label><span>COMBO</span><input id="editCombo" type="number" min="0"></label>
          </div>
          <label><span>追加メモ</span><textarea id="editMemo" rows="3"></textarea></label>
        </div>
      </div>
      <div class="dialog-footer">
        <div class="status-pill" id="recordStatusPill">未保存</div>
        <div class="footer-actions">
          <button id="trashRecordBtn" class="btn btn-light" type="button">ゴミ箱へ</button>
          <button id="deleteNowRecordBtn" class="btn btn-danger" type="button">今すぐ削除</button>
          <button class="btn btn-primary" value="default" type="submit">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="calibrateDialog" class="dialog wide-dialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <h2>機種登録・範囲設定</h2>
        <button class="icon-btn" id="closeCalibrateBtn" aria-label="閉じる" type="button">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="dialog-body calibrate-layout">
        <div class="calibrate-preview">
          <div class="calibrate-toolbar">
            <label class="file-mini">
              <input id="sampleImageInput" type="file" accept="image/*" hidden>
              サンプル画像を選択
            </label>
            <select id="profileSelect"></select>
            <button id="newProfileBtn" class="btn btn-light small" type="button">新規作成</button>
          </div>
          <div class="preview-frame" id="previewFrame">
            <img id="samplePreview" alt="サンプル画像">
            <div id="overlayBoxes" class="overlay-boxes"></div>
          </div>
        </div>
        <div class="calibrate-editor">
          <label><span>機種名</span><input id="profileNameInput" type="text" placeholder="例: 16:9標準端末"></label>
          <label><span>説明</span><textarea id="profileNoteInput" rows="2" placeholder="任意"></textarea></label>
          <div id="regionEditor" class="region-editor"></div>
          <div class="helper-text">各項目は画像に対する割合(%)で保存されます。白い画像でも調整できます。</div>
          <div class="footer-actions right">
            <button id="deleteProfileBtn" class="btn btn-light" type="button">機種削除</button>
            <button id="saveProfileBtn" class="btn btn-primary" type="button">保存</button>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="settingsDialog" class="dialog wide-dialog">
    <div class="dialog-card">
      <div class="dialog-head">
        <h2>設定</h2>
        <button class="icon-btn" id="closeSettingsBtn" aria-label="閉じる" type="button">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="dialog-body settings-grid">
        <section class="panel inner-panel">
          <h3>Google Drive</h3>
          <label><span>クライアントID</span><input id="googleClientIdInput" type="text" placeholder="xxxxx.apps.googleusercontent.com"></label>
          <label><span>APIキー</span><input id="googleApiKeyInput" type="text" placeholder="任意"></label>
          <label><span>保存先フォルダID</span><input id="googleFolderIdInput" type="text" placeholder="省略可"></label>
          <p class="helper-text">GitHub Pagesの公開元URLをGoogle Cloud Consoleに登録してください。</p>
        </section>
        <section class="panel inner-panel">
          <h3>表示</h3>
          <label class="toggle-line"><input id="enableNotificationsInput" type="checkbox">自己ベスト通知を使う</label>
          <label class="toggle-line"><input id="showOnlyBestByDefaultInput" type="checkbox">起動時は自己ベスト表示</label>
          <label class="toggle-line"><input id="persistExpandInput" type="checkbox">画像を拡大した状態を保持</label>
          <div class="footer-actions right">
            <button id="saveSettingsBtn" class="btn btn-primary" type="button">保存</button>
          </div>
        </section>
      </div>
    </div>
  </dialog>

  <dialog id="viewerDialog" class="viewer-dialog">
    <button id="closeViewerBtn" class="viewer-close" type="button" aria-label="閉じる">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <img id="viewerImage" alt="拡大表示">
    <div id="viewerCaption" class="viewer-caption"></div>
  </dialog>

  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
